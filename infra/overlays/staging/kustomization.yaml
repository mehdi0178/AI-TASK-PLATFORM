apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-task-platform-staging

resources:
  - ../../k8s

images:
  - name: REPLACE_DOCKERHUB_USER/ai-task-backend
    newTag: staging
  - name: REPLACE_DOCKERHUB_USER/ai-task-worker
    newTag: staging
  - name: REPLACE_DOCKERHUB_USER/ai-task-frontend
    newTag: staging

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: ai-task-platform-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.ai-task-platform.example.com
