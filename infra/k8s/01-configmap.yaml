apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongo:27017/ai_task_platform"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JWT_EXPIRES_IN: "1d"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"
  CORS_ORIGIN: "https://ai-task-platform.example.com"
  LOG_LEVEL: "INFO"
